<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mudroom setup</title>
    <script src="theme.js"></script>
    <link rel="preload" href="geist-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header class="nav">
      <span class="mark">Mudroom <span class="nav-divider">/</span> <span class="nav-context">Setup</span></span>
      <button id="theme-trigger" class="theme-trigger" type="button" popovertarget="theme-menu" aria-label="Color theme: system">
        <svg class="theme-icon system-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg>
        <svg class="theme-icon light-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1 1m12 12 1 1M5 19l1-1M18 6l1-1"/></svg>
        <svg class="theme-icon dark-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 13.1A8.5 8.5 0 0 1 10.9 3.5a8.5 8.5 0 1 0 9.6 9.6Z"/></svg>
        <span id="theme-label">System</span>
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
      </button>
      <div id="theme-menu" class="theme-menu" popover>
        <fieldset><legend>Appearance</legend>
          <label><input type="radio" name="theme" value="system" checked /> System</label>
          <label><input type="radio" name="theme" value="light" /> Light</label>
          <label><input type="radio" name="theme" value="dark" /> Dark</label>
        </fieldset>
      </div>
    </header>
    <main aria-labelledby="title">
      <p class="eyebrow">Configure Mudroom</p>
      <h1 id="title">Starting…</h1>
      <div id="description"></div>
      <section id="notes" class="notes" aria-label="Current setup notes" hidden>
        <div id="log" class="log" aria-live="polite"></div>
      </section>
      <form id="form" hidden></form>
      <p id="hint" class="hint" hidden></p>
      <p id="status" class="status" role="status">Working…</p>
      <details id="history" class="history" hidden>
        <summary>Earlier setup notes</summary>
        <div id="history-log" class="log"></div>
      </details>
    </main>
    <script src="app.js"></script>
  </body>
</html>
